<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E0B1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Aura</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%237C4DFF'/%3E%3Cstop offset='1' stop-color='%23FF4D8D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='54' cy='54' r='50' fill='url(%23g)'/%3E%3Ccircle cx='54' cy='54' r='28' fill='none' stroke='%23fffc' stroke-width='5'/%3E%3Ccircle cx='54' cy='54' r='12' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { --bg1:#0E0B1A; --bg2:#1C1033; --card:rgba(255,255,255,.08); --stroke:rgba(255,255,255,.12);
          --violet:#7C4DFF; --pink:#FF4D8D; --muted:rgba(255,255,255,.6); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; background:linear-gradient(var(--bg1),var(--bg2)) fixed; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-user-select:none; user-select:none; }
  main { max-width:460px; margin:0 auto; padding:calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; justify-content:space-between; }
  h1 { margin:0; font-weight:300; font-size:32px; letter-spacing:.08em; }
  .pill { border:0; border-radius:20px; padding:8px 16px; font:500 14px inherit; font-family:inherit; color:#fff; background:var(--card); cursor:pointer; }
  .grad { background:linear-gradient(90deg,var(--violet),var(--pink)); }
  #battery { color:var(--muted); }
  .card { display:flex; align-items:center; gap:12px; margin-top:14px; padding:14px 12px 14px 16px;
    background:var(--card); border:1px solid var(--stroke); border-radius:20px; }
  #dot { width:10px; height:10px; border-radius:50%; background:#6B6480; flex:none; transition:background .3s; }
  #status { flex:1; font-size:15px; }
  #dial { display:block; width:100%; max-width:320px; aspect-ratio:1; margin:18px auto 6px; touch-action:none; }
  .label { font:500 11px inherit; font-family:inherit; letter-spacing:.25em; color:rgba(255,255,255,.47); margin:12px 2px 8px; }
  #chips { display:flex; flex-wrap:wrap; gap:8px; }
  #chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; padding:10px 18px; border-radius:20px; border:1px solid var(--stroke); background:var(--card); color:var(--muted);
    font:500 14px inherit; font-family:inherit; cursor:pointer; }
  .chip.on { background:linear-gradient(90deg,var(--violet),var(--pink)); color:#fff; border-color:transparent; }
  input[type=range] { width:100%; accent-color:var(--pink); height:36px; margin:0 0 8px; }
  #stop { display:block; width:100%; height:72px; margin:10px 0 18px; border:0; border-radius:36px; color:#fff;
    font:700 22px inherit; font-family:inherit; letter-spacing:.2em; cursor:pointer;
    background:linear-gradient(90deg,#E53950,#FF6A3D); box-shadow:0 8px 24px rgba(229,57,80,.35); }
  #stop:active { transform:scale(.98); }
  .switch { display:flex; align-items:center; gap:12px; margin:6px 2px 4px; font-size:14px; color:var(--muted); cursor:pointer; }
  .switch input { display:none; }
  .switch span { position:relative; width:44px; height:26px; flex:none; border-radius:13px; background:rgba(255,255,255,.18); transition:background .2s; }
  .switch span::after { content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .2s; }
  .switch input:checked + span { background:linear-gradient(90deg,var(--violet),var(--pink)); }
  .switch input:checked + span::after { transform:translateX(18px); }
  #toggle { display:block; margin:0 auto; background:none; border:0; color:var(--muted); font:13px inherit; font-family:inherit; cursor:pointer; }
  #console { display:none; margin-top:8px; padding:12px 14px; background:rgba(0,0,0,.2); border:1px solid var(--stroke); border-radius:16px; }
  #console.show { display:block; }
  .row { display:flex; gap:8px; align-items:center; }
  #cmd { flex:1; min-width:0; background:rgba(255,255,255,.1); border:0; border-radius:12px; padding:10px 12px; color:#fff;
    font:14px ui-monospace,Menlo,monospace; -webkit-user-select:text; user-select:text; }
  #log { font:11px/1.5 ui-monospace,Menlo,monospace; color:#9BE3B4; white-space:pre-wrap; margin:10px 0 0; max-height:220px; overflow:auto; }
  #unsupported { display:none; margin-top:14px; padding:14px 16px; border-radius:16px; background:rgba(229,57,80,.15);
    border:1px solid rgba(229,57,80,.4); font-size:14px; line-height:1.45; }
  #unsupported b { color:#fff; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Aura</h1>
    <div class="row">
      <button class="pill grad" id="install" style="display:none">⬇ Instalar</button>
      <button class="pill" id="battery">🔋 —</button>
    </div>
  </header>

  <div class="card">
    <div id="dot"></div>
    <div id="status">Desconectado</div>
    <button class="pill grad" id="connect">Conectar</button>
  </div>

  <div id="unsupported">
    Este navegador não acessa Bluetooth.<br>
    <b>No iPhone:</b> instale o app <b>Bluefy</b> (App Store) e abra este link por ele.<br>
    <b>No Android:</b> use o Chrome.
  </div>

  <canvas id="dial"></canvas>

  <div class="label">MODO</div>
  <div id="chips"></div>

  <div class="label">RITMO DOS MODOS</div>
  <input type="range" id="rhythm" min="0" max="100" value="50">

  <label class="switch"><input type="checkbox" id="bg" checked><span></span>Continuar com a tela desligada</label>

  <button id="stop">PARAR</button>

  <button id="toggle">⌄&nbsp; Console avançado</button>
  <div id="console">
    <div class="row">
      <input id="cmd" placeholder="ex: Status;" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="pill grad" id="send">Enviar</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="pill" id="any">Buscar qualquer aparelho</button>
    </div>
    <pre id="log"></pre>
  </div>
</main>

<script>
const SERVICE = '53300001-0023-4bd4-bbd5-a6920e4c5653';
const TX      = '53300002-0023-4bd4-bbd5-a6920e4c5653';
const RX      = '53300003-0023-4bd4-bbd5-a6920e4c5653';
const TICK_MS = 100, MAX = 20;
const $ = s => document.querySelector(s);

// ---------- estado ----------
let device = null, tx = null, ready = false, busy = false;
const queue = [];
let wanted = 0, sent = -1, pattern = null, step = 0, lastStep = 0;
const PATTERNS = {
  onda:   [4, 8, 12, 16, 20, 16, 12, 8],
  pulso:  [20, 20, 0, 0],
  escada: [5, 5, 10, 10, 15, 15, 20, 20, 0, 0],
  batida: [16, 0, 20, 0, 0, 0, 0],
};

// ---------- UI util ----------
function log(s) {
  const t = new Date().toTimeString().slice(0, 8);
  const el = $('#log');
  el.textContent = (t + '  ' + s + '\n' + el.textContent).slice(0, 4000);
}
function setStatus(s, color = '#6B6480') { $('#status').textContent = s; $('#dot').style.background = color; }
const YELLOW = '#FFC857', GREEN = '#3DDC97', RED = '#E53950';

// ---------- chips ----------
const CHIPS = [['manual', 'Manual'], ['onda', '〰 Onda'], ['pulso', '◉ Pulso'], ['escada', '▲ Escada'],
               ['batida', '♥ Batida'], ['aleatorio', '✦ Surpresa']];
for (const [k, label] of CHIPS) {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = label; b.dataset.k = k;
  b.onclick = () => { selectChip(k); if (k === 'manual') pattern = null; else { pattern = k; step = 0; lastStep = 0; } updateMedia(); };
  $('#chips').appendChild(b);
}
function selectChip(k) { for (const c of $('#chips').children) c.classList.toggle('on', c.dataset.k === k); }
selectChip('manual');

// ---------- mostrador ----------
const cv = $('#dial'), ctx = cv.getContext('2d');
const START = 135, SWEEP = 270;
let level = 0, pulse = 0;
function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.width * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize); resize();
const rad = a => a * Math.PI / 180;

function draw() {
  const w = cv.width / (window.devicePixelRatio || 1), cx = w / 2, cy = w / 2, r = w / 2 - 28;
  const frac = level / MAX;
  ctx.clearRect(0, 0, w, w);

  if (level > 0) { // halo pulsante
    const hr = r * (0.55 + 0.12 * pulse), a = (1 - pulse) * (0.16 + 0.47 * frac);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, hr);
    g.addColorStop(0, `rgba(255,77,141,${a})`); g.addColorStop(1, 'rgba(255,77,141,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, hr, 0, 2 * Math.PI); ctx.fill();
  }
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 2;
  for (let i = 0; i <= MAX; i++) {
    const a = rad(START + SWEEP * i / MAX), r1 = r - 22, r2 = r - (i % 5 === 0 ? 32 : 27);
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2); ctx.stroke();
  }
  ctx.lineWidth = 18; ctx.strokeStyle = 'rgba(255,255,255,.13)';
  ctx.beginPath(); ctx.arc(cx, cy, r, rad(START), rad(START + SWEEP)); ctx.stroke();

  if (level > 0) {
    let grad;
    if (ctx.createConicGradient) {
      grad = ctx.createConicGradient(rad(START - 5), cx, cy);
      [['#7C4DFF', 0], ['#B44DFF', .25], ['#FF4D8D', .5], ['#FF7A59', .75], ['#7C4DFF', 1]].forEach(([c, p]) => grad.addColorStop(p, c));
    } else {
      grad = ctx.createLinearGradient(cx - r, cy + r, cx + r, cy - r);
      grad.addColorStop(0, '#7C4DFF'); grad.addColorStop(1, '#FF4D8D');
    }
    ctx.strokeStyle = grad;
    ctx.save(); ctx.shadowColor = 'rgba(255,77,141,.8)'; ctx.shadowBlur = 18 + 14 * frac; ctx.lineWidth = 18;
    ctx.beginPath(); ctx.arc(cx, cy, r, rad(START), rad(START + SWEEP * frac)); ctx.stroke(); ctx.restore();
  }
  const ta = rad(START + SWEEP * frac);
  ctx.save(); ctx.shadowColor = 'rgba(255,77,141,.7)'; ctx.shadowBlur = 10; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx + Math.cos(ta) * r, cy + Math.sin(ta) * r, 13, 0, 2 * Math.PI); ctx.fill(); ctx.restore();

  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `200 ${Math.round(r * 0.62)}px -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.fillText(String(level), cx, cy - 8);
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '500 11px -apple-system, "Segoe UI", Roboto, sans-serif';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '3px';
  ctx.fillText(level === 0 ? 'DESLIGADO' : 'INTENSIDADE', cx, cy + r * 0.42);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
}
function setLevel(l) { level = Math.max(0, Math.min(MAX, l)); }
(function anim(t) { pulse = (t % 1400) / 1400; draw(); requestAnimationFrame(anim); })(0);

function touch(e) {
  const b = cv.getBoundingClientRect(), cx = b.width / 2, cy = b.height / 2;
  const ang = Math.atan2(e.clientY - b.top - cy, e.clientX - b.left - cx) * 180 / Math.PI;
  let rel = (((ang - START) % 360) + 360) % 360;
  if (rel > SWEEP) rel = rel < SWEEP + 45 ? SWEEP : 0; // zona morta: prende na ponta mais próxima
  const l = Math.round(rel / SWEEP * MAX);
  if (l !== level) {
    setLevel(l); selectChip('manual'); pattern = null; wanted = l;
    if (navigator.vibrate) navigator.vibrate(5);
  }
}
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); touch(e); });
cv.addEventListener('pointermove', e => { if (cv.hasPointerCapture(e.pointerId)) touch(e); });

// ---------- Bluetooth ----------
const enc = new TextEncoder(), dec = new TextDecoder();
const WRITE_TIMEOUT_MS = 3000;   // escrita sem resposta: libera a fila
const KEEPALIVE_MS = 5000;       // reenvia o nível atual (firmware barato pode "esquecer")
const BATTERY_POLL_MS = 60000;   // também serve de teste de vida do link
let stopConfirmed = false, writeFails = 0, wantConnected = false, reconnectTimer = null, attempt = 0, lastKeep = 0, lastBattery = 0;

if (!navigator.bluetooth) {
  $('#unsupported').style.display = 'block';
  setStatus('Bluetooth indisponível', RED);
}

function showHelp() {
  $('#unsupported').innerHTML = 'O Chrome não conseguiu usar o Bluetooth. Confira:<br>' +
    '<b>1.</b> Bluetooth e <b>Localização</b> ligados no celular.<br>' +
    '<b>2.</b> Configurações → Apps → <b>Chrome</b> → Permissões → <b>Dispositivos por perto</b>: Permitir.<br>' +
    '<b>3.</b> No Chrome: ⋮ → Configurações → Configurações do site → <b>Bluetooth</b>: permitido.';
  $('#unsupported').style.display = 'block';
}

let choosing = false;
async function connect(any = false) {
  if (!navigator.bluetooth || choosing || settingUp) return;
  clearTimeout(reconnectTimer);
  try {
    if (navigator.bluetooth.getAvailability && !(await navigator.bluetooth.getAvailability())) {
      log('getAvailability: false'); setStatus('Bluetooth indisponível para o navegador', RED); showHelp(); return;
    }
  } catch {}
  try {
    setStatus('Escolha o aparelho…', YELLOW);
    choosing = true;
    const d = await navigator.bluetooth.requestDevice(any
      ? { acceptAllDevices: true, optionalServices: [SERVICE] }
      : { filters: [{ namePrefix: 'LVS-' }, { services: [SERVICE] }], optionalServices: [SERVICE] });
    choosing = false;
    if (device) {
      device.removeEventListener('gattserverdisconnected', onDisconnected);
      try { if (device.gatt.connected) device.gatt.disconnect(); } catch {}
    }
    device = d;
    device.addEventListener('gattserverdisconnected', onDisconnected);
    wantConnected = true; attempt = 0;
    $('#connect').textContent = 'Sair';
    startBackground();               // precisa do toque do usuário para liberar o áudio
    setStatus('Conectando…', YELLOW);
    await setup();
  } catch (e) {
    choosing = false;
    log('erro: ' + e.name + ': ' + e.message);
    if (e.name === 'NotFoundError' && /cancel/i.test(e.message)) setStatus('Nenhum aparelho escolhido');
    else if (e.name === 'NotFoundError') { setStatus('Chrome sem acesso ao Bluetooth: ' + e.message, RED); showHelp(); }
    else if (wantConnected && attempt < 3) scheduleReconnect();
    else { wantConnected = false; setStatus('Falhou: ' + e.message, RED); }
    if (!wantConnected) cleanup();
  }
}

// Abre GATT, características e notificações. Usado na 1ª conexão e nas reconexões.
let settingUp = false;
async function setup() {
  if (settingUp) return;
  settingUp = true;
  try { await doSetup(); } finally { settingUp = false; }
}
// Cada etapa tem prazo: no Android, o Chrome às vezes fica esperando para sempre.
function withTimeout(p, ms, what) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(what + ': sem resposta em ' + ms / 1000 + ' s')), ms))]);
}
async function doSetup() {
  const step = (n, txt) => { setStatus('Conectando… ' + n + '/3 ' + txt, YELLOW); log(n + '/3 ' + txt); };
  try {
    step(1, 'link Bluetooth');
    if (device.gatt.connected) { device.gatt.disconnect(); await new Promise(r => setTimeout(r, 500)); }
    let timedOut = false;
    const cp = device.gatt.connect();
    cp.then(() => { if (timedOut && !ready && !settingUp) { log('link atrasado descartado'); try { device.gatt.disconnect(); } catch {} } }, () => {});
    const server = await withTimeout(cp, 12000, 'link').catch(e => { timedOut = true; throw e; });
    await new Promise(r => setTimeout(r, 300)); // aparelho barato precisa de um respiro antes da descoberta
    step(2, 'serviço');
    const svc = await withTimeout(server.getPrimaryService(SERVICE), 8000, 'serviço');
    step(3, 'canais');
    tx = await withTimeout(svc.getCharacteristic(TX), 5000, 'canal TX');
    const rx = await withTimeout(svc.getCharacteristic(RX), 5000, 'canal RX');
    rx.removeEventListener('characteristicvaluechanged', onRx);
    rx.addEventListener('characteristicvaluechanged', onRx);
    // Notificações só servem para ler bateria/respostas: não podem travar a conexão.
    withTimeout(rx.startNotifications(), 5000, 'notificações')
      .then(() => { log('notificações ativas'); enqueue('Battery;'); })
      .catch(e => log('sem notificações (' + e.message + ') — controle funciona mesmo assim'));
  } catch (e) {
    try { if (device.gatt.connected) device.gatt.disconnect(); } catch {}
    throw e;
  }
  const wasReconnect = attempt > 0;
  ready = true; busy = false; sent = -1; attempt = 0; queue.length = 0;
  setStatus(device.name || 'Conectado', GREEN);
  $('#connect').textContent = 'Sair';
  log(wasReconnect ? 'reconectado — retomando' : 'pronto');
  lastBattery = performance.now();
  keepAwake();
  updateMedia();
}

function onRx(ev) {
  const r = dec.decode(ev.target.value).trim();
  log('← ' + r);
  const d = r.replace(';', '').trim();
  if (/^\d{1,3}$/.test(d)) $('#battery').textContent = '🔋 ' + d + '%';
}

function onDisconnected() {
  ready = false; busy = false; tx = null; queue.length = 0; sent = -1;
  log('desconectou');
  if (settingUp) return;                 // durante o setup, quem decide é o próprio setup
  if (wantConnected) scheduleReconnect();
  else { cleanup(); setStatus('Desconectado'); }
}

// Reconexão: algumas tentativas automáticas com espera crescente (1, 2, 4, 8, 15 s).
// O modo/nível ativo é mantido e retomado ao voltar. Se não der, pede um toque em
// "Reconectar", que refaz a escolha do aparelho do zero (o que destrava o Chrome no Android).
const MAX_AUTO_RECONNECT = 5;
function scheduleReconnect() {
  clearTimeout(reconnectTimer);
  if (attempt >= MAX_AUTO_RECONNECT) { giveUp(); return; }
  const delay = Math.min(15000, 1000 * 2 ** attempt++);
  setStatus('Reconectando… (' + attempt + '/' + MAX_AUTO_RECONNECT + ')', YELLOW);
  log('nova tentativa em ' + Math.round(delay / 1000) + ' s');
  reconnectTimer = setTimeout(async () => {
    if (!wantConnected || ready || settingUp) return;
    try { await setup(); }
    catch (e) {
      log('reconexão falhou: ' + e.message);
      if (wantConnected && !ready) scheduleReconnect();
    }
  }, delay);
}

function giveUp() {
  wantConnected = false; clearTimeout(reconnectTimer);
  ready = false; busy = false; tx = null; queue.length = 0; sent = -1;
  if (device) {
    device.removeEventListener('gattserverdisconnected', onDisconnected); // senão o evento apagaria este aviso
    try { if (device.gatt.connected) device.gatt.disconnect(); } catch {}
  }
  stopBackground();
  setStatus('Conexão perdida', RED);
  log('sem sucesso — toque em Reconectar (se persistir: desligue e ligue o aparelho)');
  $('#connect').textContent = 'Reconectar';
}

function cleanup() {
  clearTimeout(reconnectTimer);
  ready = false; busy = false; tx = null; queue.length = 0; sent = -1;
  pattern = null; wanted = 0; setLevel(0); selectChip('manual');
  $('#connect').textContent = 'Conectar';
  stopBackground();
}

async function disconnect() {
  wantConnected = false; clearTimeout(reconnectTimer);
  pattern = null; wanted = 0;
  // PARAR pela fila (nunca duas escritas GATT ao mesmo tempo); só corta o link depois de o
  // aparelho confirmar, com até 3 tentativas.
  for (let tries = 0; ready && tries < 3; tries++) {
    stopConfirmed = false;
    queue.length = 0; queue.push('Vibrate:0;'); sent = 0; pump();
    for (let t = 0; t < 40 && (busy || queue.length); t++) await new Promise(r => setTimeout(r, 100));
    if (stopConfirmed) break;
    log('parada não confirmada — tentando de novo');
  }
  if (device && device.gatt.connected) device.gatt.disconnect();
  cleanup(); setStatus('Desconectado');
}

// Escrita COM resposta, com prazo: se o aparelho não confirmar, a fila não trava.
function write(c) {
  if (!c.startsWith('Vibrate')) log('→ ' + c);
  const data = enc.encode(c);
  const op = tx.writeValueWithResponse ? tx.writeValueWithResponse(data) : tx.writeValue(data);
  return Promise.race([op, new Promise((_, rej) => setTimeout(() => rej(new Error('sem resposta')), WRITE_TIMEOUT_MS))]);
}
async function pump() {
  if (busy || !ready || !queue.length) return;
  const c = queue.shift();
  busy = true;
  try { await write(c); writeFails = 0; if (c === 'Vibrate:0;') stopConfirmed = true; }
  catch (e) {
    log('falha em ' + c + ': ' + e.message);
    if (c.startsWith('Vibrate')) sent = -1;
    // link "zumbi": parece conectado mas nada passa — derruba para a reconexão assumir
    if (++writeFails >= 3 && ready) { log('link sem resposta — reiniciando conexão'); writeFails = 0; try { device.gatt.disconnect(); } catch {} }
  }
  busy = false;
  pump();
}
function enqueue(c) { if (!ready) { log('não conectado: ' + c); return; } queue.push(c); pump(); }

// Ticker: padrões, limite de 10 comandos/s, keepalive e leitura periódica da bateria
setInterval(() => {
  const now = performance.now(), stepMs = 800 - $('#rhythm').value * 6;
  if (pattern && now - lastStep >= stepMs) {
    lastStep = now;
    wanted = pattern === 'aleatorio' ? 4 + Math.floor(Math.random() * 17)
           : PATTERNS[pattern][step++ % PATTERNS[pattern].length];
    setLevel(wanted);
  }
  if (!ready || busy || queue.length) return;
  if (wanted !== sent || (wanted > 0 && now - lastKeep > KEEPALIVE_MS)) {
    sent = wanted; lastKeep = now; queue.push('Vibrate:' + wanted + ';'); pump();
  } else if (now - lastBattery > BATTERY_POLL_MS) {
    lastBattery = now; queue.push('Battery;'); pump();
  }
}, TICK_MS);

function stopAll() {
  pattern = null; wanted = 0; setLevel(0); selectChip('manual');
  if (navigator.vibrate) navigator.vibrate(30);
  if (ready) { queue.length = 0; queue.unshift('Vibrate:0;'); sent = 0; pump(); }
  updateMedia();
}

// ---------- segundo plano ----------
// Navegadores congelam páginas escondidas (timers param, conexão cai). Uma página que está
// tocando mídia não é congelada nem tem os timers limitados; por isso, enquanto conectado,
// tocamos um áudio em loop num volume inaudível (-60 dBFS) e registramos a Media Session,
// que ainda dá controles na tela de bloqueio (pausar = PARAR).
let bgAudio = null;
function silentWav() {
  const rate = 8000, n = rate * 2, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, s) => [...s].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.round(33 * Math.sin(i * 2 * Math.PI * 40 / rate)), true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function startBackground() {
  if (!$('#bg').checked) return;
  try {
    if (!bgAudio) { bgAudio = new Audio(silentWav()); bgAudio.loop = true; }
    bgAudio.play().then(() => log('modo segundo plano ativo')).catch(e => log('segundo plano indisponível: ' + e.message));
  } catch (e) { log('segundo plano indisponível: ' + e.message); }
  if ('mediaSession' in navigator) {
    const ms = navigator.mediaSession;
    const set = (a, f) => { try { ms.setActionHandler(a, f); } catch {} };
    set('pause', () => { stopAll(); bgAudio && bgAudio.play(); });
    set('stop', () => disconnect());
    set('play', () => bgAudio && bgAudio.play());
    updateMedia();
  }
}
function stopBackground() {
  if (bgAudio) bgAudio.pause();
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = null;
}
function updateMedia() {
  if (!('mediaSession' in navigator) || !bgAudio || bgAudio.paused || !window.MediaMetadata) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'Aura', artist: ready ? (pattern ? 'Modo ' + pattern : wanted > 0 ? 'Intensidade ' + wanted : 'Parado') : 'Reconectando…',
    artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }],
  });
}
$('#bg').onchange = () => { if ($('#bg').checked && wantConnected) startBackground(); else if (!$('#bg').checked) stopBackground(); };

// Mantém a tela acesa enquanto conectado (se o navegador permitir)
let lock = null;
async function keepAwake() { try { lock = await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (ready) keepAwake();
  // de volta à frente: se a conexão caiu enquanto escondido, tenta de novo já
  if (wantConnected && !ready) { attempt = 0; scheduleReconnect(); }
});

// ---------- botões ----------
$('#connect').onclick = () => $('#connect').textContent === 'Sair' ? disconnect() : connect();  // 'Reconectar' também cai em connect()
$('#any').onclick = () => { if (!ready) connect(true); };
$('#battery').onclick = () => enqueue('Battery;');
$('#stop').onclick = stopAll;
$('#toggle').onclick = () => {
  const show = $('#console').classList.toggle('show');
  $('#toggle').innerHTML = show ? '⌃&nbsp; Ocultar console' : '⌄&nbsp; Console avançado';
};
$('#send').onclick = () => {
  let c = $('#cmd').value.trim(); if (!c) return;
  if (!c.endsWith(';')) c += ';';
  enqueue(c);
};
window.addEventListener('pagehide', () => { if (ready) { try { tx.writeValue(enc.encode('Vibrate:0;')); } catch {} } });
// Instalação como app: o Chrome avisa quando o site é instalável; aí mostramos o botão.
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#install').style.display = ''; });
window.addEventListener('appinstalled', () => { installEvt = null; $('#install').style.display = 'none'; log('app instalado'); });
$('#install').onclick = async () => {
  if (!installEvt) return;
  installEvt.prompt();
  await installEvt.userChoice;
  installEvt = null; $('#install').style.display = 'none';
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
